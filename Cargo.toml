[package]
name = "carscal"
version = "0.1.1"
edition = "2021"
description = "A terminal packet analyzer — a tiny Wireshark for the TUI, in Rust. Rust replica of carcal."
license = "MIT"
repository = "https://github.com/stricaud/carscal"
homepage = "https://github.com/stricaud/carscal"
readme = "README.md"
keywords = ["pcap", "wireshark", "tui", "network", "packet"]
categories = ["command-line-utilities", "network-programming"]
authors = ["Seb Tricaud <sebastien.tricaud@proton.me>"]

[dependencies]
gtcaca = "0.1.15"
libpcapng = "0.18.2"
# Embedded scripting (generalized MQS). Vendored LuaJIT — fast, no system dependency.
mlua = { version = "0.9", features = ["luajit", "vendored"] }

[profile.release]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
