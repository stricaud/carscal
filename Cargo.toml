[package]
name = "carscal"
version = "0.1.0"
edition = "2021"
description = "A terminal packet analyzer — a tiny Wireshark for the TUI, in Rust. Rust replica of carcal."
license = "MIT"
repository = "https://github.com/stricaud/carscal"
authors = ["Seb Tricaud <sebastien.tricaud@proton.me>"]

[dependencies]
gtcaca = "0.1.14"
libpcapng = "0.15.6"
# Embedded scripting (generalized MQS). Vendored LuaJIT — fast, no system dependency.
mlua = { version = "0.9", features = ["luajit", "vendored"] }

[profile.release]
opt-level = 3
